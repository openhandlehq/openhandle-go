name: Merge SDK automation PRs

run-name: Merge SDK automation PR #${{ github.event.pull_request.number || inputs.pull_request }} as openhandle-sdk-sync[bot]

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Trusted SDK automation pull request number
        required: true
        type: number

permissions:
  contents: read

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'openhandle-sdk-sync[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create SDK merge token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.SDK_SYNC_APP_PRIVATE_KEY }}
          owner: openhandlehq
          repositories: openhandle-go
          permission-contents: write
          permission-pull-requests: write

      - name: Validate bot pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"

          test "$(jq -r '.user.login' <<< "$pr")" = 'openhandle-sdk-sync[bot]'
          test "$(jq -r '.base.ref' <<< "$pr")" = 'main'
          test "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$REPOSITORY"
          test "$(jq -r '.draft' <<< "$pr")" = 'false'
          test "$(jq -r '.state' <<< "$pr")" = 'open'

          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          title="$(jq -r '.title' <<< "$pr")"
          case "$head_ref" in
            automation/api-*) test "$title" = 'feat: sync API contract' ;;
            release-please--branches--main--components--openhandle-go)
              [[ "$title" == chore\(main\):\ release\ openhandle-go\ * ]]
              open_sync_count="$(gh api "repos/$REPOSITORY/pulls?state=open&base=main&per_page=100" \
                --jq '[.[] | select(.head.ref | startswith("automation/api-"))] | length')"
              if (( open_sync_count > 0 )); then
                echo "Refusing to release while $open_sync_count SDK synchronization pull request(s) remain open." >&2
                exit 1
              fi
              ;;
            *) echo "Refusing untrusted bot branch: $head_ref" >&2; exit 1 ;;
          esac

          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          if [[ -n "$EVENT_HEAD_SHA" && "$head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "Ignoring stale event for $EVENT_HEAD_SHA; current head is $head_sha."
            exit 0
          fi

          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for SDK CI
        if: steps.pull-request.outputs.head-sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 90); do
            checks="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs")"
            test_count="$(jq '[.check_runs[] | select(.name == "test")] | length' <<< "$checks")"
            failed_count="$(jq '[.check_runs[] | select(.name == "test" and .status == "completed" and .conclusion != "success")] | length' <<< "$checks")"
            pending_count="$(jq '[.check_runs[] | select(.name == "test" and .status != "completed")] | length' <<< "$checks")"

            if (( failed_count > 0 )); then
              echo "SDK CI failed for $HEAD_SHA." >&2
              exit 1
            fi
            if (( test_count > 0 && pending_count == 0 )); then
              echo "SDK CI passed for $HEAD_SHA."
              exit 0
            fi

            echo "Waiting for SDK CI (attempt $attempt/90)."
            sleep 10
          done

          echo "Timed out waiting for SDK CI." >&2
          exit 1

      - name: Merge as SDK bot
        if: steps.pull-request.outputs.head-sha != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REPOSITORY: ${{ github.repository }}
        run: |
          result="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=merge \
            -f sha="$HEAD_SHA")"
          test "$(jq -r '.merged' <<< "$result")" = 'true'

name: Remove legacy Go v1 release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create SDK release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SDK_SYNC_APP_ID }}
          private-key: ${{ secrets.SDK_SYNC_APP_PRIVATE_KEY }}
          owner: openhandlehq
          repositories: openhandle-go
          permission-contents: write

      - name: Remove component-prefixed release and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view openhandle-go-v1.0.0 --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release delete openhandle-go-v1.0.0 --repo "$REPOSITORY" --cleanup-tag --yes
          fi

          gh release view v1.0.0 --repo "$REPOSITORY" >/dev/null

          if gh release view openhandle-go-v1.0.0 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'The legacy component-prefixed release still exists.' >&2
            exit 1
          fi

          if gh api "repos/$REPOSITORY/git/ref/tags/openhandle-go-v1.0.0" >/dev/null 2>&1; then
            echo 'The legacy component-prefixed tag still exists.' >&2
            exit 1
          fi
